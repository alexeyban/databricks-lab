services:
  pumpfun-ingestor:
    build: .
    image: pumpfun-ingestor:local
    container_name: pumpfun-ingestor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Some hosts (systemd-resolved's 127.0.0.53 stub) aren't reachable from
    # inside the container network namespace, breaking all DNS lookups.
    # Pin public resolvers explicitly rather than relying on the host's.
    dns:
      - 8.8.8.8
      - 1.1.1.1
